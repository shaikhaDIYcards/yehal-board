<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>واجبات اليهال</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F4F8FF">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="واجبات اليهال">
<link rel="preload" href="fonts/baloo-600-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/readex-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{font-family:"Baloo Bhaijaan 2";font-weight:400 800;font-display:swap;src:url(fonts/baloo-600-arabic.woff2) format("woff2");
    unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FEFC}
  @font-face{font-family:"Baloo Bhaijaan 2";font-weight:400 800;font-display:swap;src:url(fonts/baloo-600-latin.woff2) format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF}
  @font-face{font-family:"Readex Pro";font-weight:300 700;font-display:swap;src:url(fonts/readex-400-arabic.woff2) format("woff2");
    unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FEFC}
  @font-face{font-family:"Readex Pro";font-weight:300 700;font-display:swap;src:url(fonts/readex-400-latin.woff2) format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF}

  :root{
    --bg:#F4F8FF; --grid:rgba(47,111,237,.075); --paper:#FFFFFF; --ink:#1D2B4F; --soft:#5A6684; --line:#DCE5F2;
    --sun:#FFC93C; --sun-d:#E0A100; --sun-w:#FFF3CC;
    --coral:#EE5A36; --coral-d:#C9431F; --coral-w:#FFE4DB;
    --quran:#7A4FD0; --quran-d:#5E37B0; --quran-w:#EFE8FC;
    --tamim:#2F6FED; --tamim-d:#1E54C2; --tamim-w:#E3ECFF;
    --rashid:#0E9F6E; --rashid-d:#0A7852; --rashid-w:#DBF3E8;
    --fatima:#E9579A; --fatima-d:#C03A7A; --fatima-w:#FDE4EF;
    --display:"Baloo Bhaijaan 2","Readex Pro",system-ui,sans-serif;
    --body:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
    --ease:cubic-bezier(.2,.9,.25,1.15);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.6;
       background-color:var(--bg);
       background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
       background-size:26px 26px}
  button{font:inherit;color:inherit}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:10px}
  .wrap{max-width:1320px;margin:0 auto;padding:0 18px}
  svg.i{width:22px;height:22px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  bdi{unicode-bidi:isolate}

  /* ---------- top ---------- */
  .top{padding:22px 0 10px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px}
  .hello{margin:0;color:var(--soft);font-weight:500}
  .top h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(38px,6vw,60px);line-height:1}
  .summary{margin:8px 0 0;font-size:18px}
  .summary b{font-family:var(--display);font-size:22px}
  .top-actions{display:flex;gap:10px;flex-wrap:wrap}

  .btn{--c:var(--ink);--d:#0F1A36;display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;cursor:pointer;text-decoration:none;
       border-radius:16px;padding:11px 18px;min-height:50px;font-weight:600;font-size:16.5px;line-height:1.2;
       background:var(--c);color:#fff;box-shadow:0 4px 0 var(--d);transform:translateY(0);transition:transform .12s,box-shadow .12s}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--d)}
  .btn.sun{--c:var(--sun);--d:var(--sun-d);color:var(--ink)}
  .btn.ghost{background:var(--paper);color:var(--c);box-shadow:0 4px 0 color-mix(in srgb,var(--c) 30%,transparent),inset 0 0 0 2px var(--c)}
  .btn.ghost:active{box-shadow:0 1px 0 color-mix(in srgb,var(--c) 30%,transparent),inset 0 0 0 2px var(--c)}
  .btn.big{font-family:var(--display);font-weight:700;font-size:22px;min-height:58px;padding:12px 22px;border-radius:18px}
  .btn.small{min-height:42px;padding:8px 14px;font-size:15px;border-radius:13px}
  .btn.wide{width:100%}

  /* ---------- mobile kid tabs ---------- */
  .tabs-bar{position:sticky;top:0;z-index:20;padding:10px 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .tabs{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border-radius:20px;padding:5px;box-shadow:0 3px 0 var(--line)}
  .tab{position:relative;z-index:1;border:0;background:none;cursor:pointer;border-radius:15px;padding:9px 6px;min-height:50px;
       font-family:var(--display);font-weight:700;font-size:21px;line-height:1;color:var(--c);display:flex;align-items:center;justify-content:center;gap:7px;transition:color .25s}
  .tab[aria-selected=true]{color:#fff}
  .tab .n{min-width:24px;height:24px;border-radius:12px;padding:0 6px;font-family:var(--body);font-size:13px;font-weight:600;line-height:24px;background:var(--sun);color:var(--ink)}
  .tabs .pill{position:absolute;z-index:0;top:5px;bottom:5px;width:calc((100% - 10px)/3);right:5px;border-radius:15px;background:var(--pc,var(--tamim));
              transform:translateX(calc(var(--pi,0) * -100%));transition:transform .4s var(--ease),background .3s}

  /* ---------- lanes ---------- */
  .lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start;padding:8px 0 30px}
  .lane{--c:var(--tamim);--d:var(--tamim-d);--w:var(--tamim-w);background:var(--w);border-radius:30px;padding:18px 16px 20px;min-width:0}
  .lane[data-kid=rashid]{--c:var(--rashid);--d:var(--rashid-d);--w:var(--rashid-w)}
  .lane[data-kid=fatima]{--c:var(--fatima);--d:var(--fatima-d);--w:var(--fatima-w)}
  .lane-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .lane-head h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(50px,5.4vw,70px);line-height:.92;color:var(--c)}
  .lane-head p{margin:4px 0 0;color:var(--soft);font-size:15px}
  .stars{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:6px 12px 6px 10px;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 22%,transparent);white-space:nowrap}
  .stars svg{width:22px;height:22px;fill:var(--sun);stroke:var(--sun-d);stroke-width:1.4}
  .stars b{font-family:var(--display);font-size:22px;line-height:1}
  .stars span{font-size:13px;color:var(--soft)}
  .stars.bump{animation:bump .5s var(--ease)}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(-6deg)}100%{transform:scale(1)}}
  .streak{margin:8px 0 0;font-size:14px;color:var(--d);font-weight:600}

  .lane-actions{display:flex;gap:8px;margin:16px 0 0}
  .lane-actions .btn.big{flex:1}
  .more-btn{width:58px;min-height:58px;padding:0;border-radius:18px}
  .more-btn svg{fill:currentColor;stroke:none}
  .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
  .more.open{grid-template-rows:1fr}
  .more > div{overflow:hidden}
  .more-in{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0 2px}

  .count{display:flex;align-items:center;gap:12px;margin:14px 0 0;background:var(--paper);border-radius:20px;padding:10px 14px 10px 10px}
  .count .num{flex:0 0 auto;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;
              background:conic-gradient(var(--c) calc(var(--p,0) * 1%),color-mix(in srgb,var(--c) 15%,transparent) 0)}
  .count .num b{width:50px;height:50px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:var(--display);font-size:24px;line-height:1;color:var(--c)}
  .count small{display:block;color:var(--soft);font-size:13.5px}
  .count strong{display:block;font-family:var(--display);font-size:20px;line-height:1.25}

  /* tiers */
  .tier{margin-top:22px}
  .tier-h{display:flex;align-items:center;gap:10px;margin:0 0 10px}
  .tier-h h3{margin:0;font-family:var(--display);font-weight:800;font-size:25px;line-height:1}
  .tier-h span{color:var(--soft);font-size:14px}
  .tier-now .tier-h h3{background:var(--sun);border-radius:12px;padding:6px 12px 3px;display:flex;align-items:center;gap:8px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 0 color-mix(in srgb,var(--coral) 60%,transparent);animation:pulse 2s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .stack{display:grid;gap:10px}
  .calm{margin:0;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--paper) 65%,transparent);color:var(--soft)}

  /* cards */
  .card{--k:var(--c);--kd:var(--d);--kw:var(--w);position:relative;background:var(--paper);border-radius:20px;padding:13px 13px 13px 12px;
        box-shadow:0 4px 0 color-mix(in srgb,var(--k) 28%,transparent);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;
        transition:opacity .35s,transform .35s var(--ease)}
  .card.event{--k:var(--sun-d);--kw:var(--sun-w)}
  .card.exam{--k:var(--coral);--kw:var(--coral-w)}
  .card.quran{--k:var(--quran);--kw:var(--quran-w)}
  .card.going{opacity:0;transform:translateX(-30px) scale(.96)}
  .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--kw);color:var(--k)}
  .card.event .ico{color:#9A6B00}
  .card h4,.card .h4{display:block;margin:0;font-family:var(--display);font-weight:700;font-size:20.5px;line-height:1.25}
  .when{display:inline-block;margin:3px 0 0;font-size:14px;font-weight:600;color:var(--kd)}
  .card.event .when{color:#8A5F00}.card.exam .when{color:var(--coral-d)}.card.quran .when{color:var(--quran-d)}
  .card p{margin:4px 0 0;font-size:15.5px;color:var(--soft)}
  .card .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--kw);color:var(--kd);margin-inline-start:6px;vertical-align:2px}
  .chip{display:inline-flex;align-items:center;gap:6px;border:0;cursor:pointer;text-decoration:none;font-size:14.5px;font-weight:600;
        padding:7px 12px;border-radius:12px;background:var(--kw);color:var(--kd);min-height:38px}
  .card.event .chip{color:#7A5400}
  .chip svg.i{width:18px;height:18px}

  .tick{width:48px;height:48px;border-radius:50%;border:3px solid var(--k);background:var(--paper);cursor:pointer;display:grid;place-items:center;color:#fff;padding:0;flex:0 0 auto;
        transition:background .2s,transform .2s var(--ease)}
  .tick svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24}
  .tick:hover{background:var(--kw)}
  .tick[aria-pressed=true]{background:var(--k);transform:scale(1.12)}
  .tick[aria-pressed=true] svg{stroke-dashoffset:0;transition:stroke-dashoffset .35s ease .05s}
  .card.event .tick{border-color:var(--sun-d)}
  .card.event .tick[aria-pressed=true]{background:var(--sun-d)}

  /* expandable */
  .xbtn{border:0;background:none;padding:0;cursor:pointer;text-align:inherit;width:100%;display:block}
  .x{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
  .x.open{grid-template-rows:1fr}
  .x > div{overflow:hidden}
  .x ul{margin:10px 0 0;padding-inline-start:20px;font-size:15.5px}
  .x ul.en{text-align:left}
  .x li{margin:3px 0}
  .caret{display:inline-block;margin-inline-start:9px;width:9px;height:9px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:translateY(-4px) rotate(45deg);transition:transform .3s;vertical-align:middle}
  .open-x .caret{transform:translateY(1px) rotate(-135deg)}
  .rest-btn{border:0;cursor:pointer;width:100%;margin-top:10px;padding:12px;border-radius:16px;background:color-mix(in srgb,var(--paper) 70%,transparent);font-weight:600;color:var(--d)}
  .rest-btn + .x > div > .stack{padding-top:10px}
  .short{display:none}

  /* homework checklist */
  .bar{height:12px;border-radius:6px;background:var(--kw);overflow:hidden;margin-top:9px}
  .bar i{display:block;height:100%;width:var(--v,0%);background:var(--k);border-radius:6px;transition:width .6s var(--ease)}
  .hw{list-style:none;margin:10px 0 0;padding:0}
  .hw li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .hw li:last-child{border-bottom:0}
  .hw .tick{width:40px;height:40px;border-width:3px}
  .hw .tick svg{width:22px;height:22px}
  .hw .t{flex:1;font-weight:500}
  .hw li.done .t{color:var(--soft);text-decoration:line-through;text-decoration-thickness:2px}
  .hw a{font-size:14px;font-weight:600;text-decoration:none;padding:6px 11px;border-radius:10px;background:var(--kw);color:var(--kd);white-space:nowrap}

  /* exam row */
  .card.exam{grid-template-columns:auto 1fr}
  .days{width:58px;height:62px;border-radius:16px;background:var(--coral-w);color:var(--coral-d);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .days b{font-family:var(--display);font-size:27px;font-weight:800}
  .days small{font-size:12px;font-weight:600;margin-top:2px}
  .days.hot{background:var(--coral);color:#fff}

  /* done group */
  .done-box{margin-top:22px;background:color-mix(in srgb,var(--paper) 60%,transparent);border-radius:20px;padding:4px 14px}
  .done-box > button{border:0;background:none;cursor:pointer;width:100%;padding:12px 0;text-align:inherit;font-family:var(--display);font-weight:700;font-size:19px;color:var(--d);display:flex;align-items:center;gap:8px}
  .done-list{list-style:none;margin:0 0 10px;padding:0}
  .done-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;color:var(--soft);font-size:15px}
  .done-list li span{text-decoration:line-through}
  .undo{border:0;background:var(--paper);border-radius:10px;padding:6px 10px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--d);white-space:nowrap}

  .lane-foot{margin:14px 2px 0;color:var(--soft);font-size:14.5px}

  /* ---------- dialogs ---------- */
  dialog{border:0;padding:0;background:transparent;color:inherit;max-width:none;max-height:none}
  dialog::backdrop{background:rgba(29,43,79,.35);backdrop-filter:blur(3px)}
  .sheet{width:min(560px,100vw - 20px);max-height:calc(100dvh - 30px);overflow:auto;background:var(--paper);border-radius:26px;padding:22px 20px 20px;
         box-shadow:0 20px 50px rgba(29,43,79,.25)}
  dialog[open] .sheet{animation:rise .38s var(--ease)}
  @keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
  .sheet h2{margin:0 0 6px;font-family:var(--display);font-weight:800;font-size:30px;line-height:1.15}
  .sheet p{margin:6px 0;color:var(--soft)}
  .x-close{position:sticky;top:0;float:left;width:44px;height:44px;border-radius:50%;border:0;background:var(--bg);cursor:pointer;display:grid;place-items:center}
  .who{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0}
  .who button{border:0;cursor:pointer;border-radius:14px;padding:10px 4px;font-family:var(--display);font-weight:700;font-size:18px;background:var(--bg);color:var(--c,var(--ink))}
  .who button[aria-pressed=true]{background:var(--c,var(--ink));color:#fff}
  .cal-go{display:grid;gap:10px;margin-top:6px}
  .note{font-size:14px;background:var(--sun-w);border-radius:14px;padding:10px 12px;margin-top:14px;color:#6B4C00}

  table.plan{width:100%;border-collapse:collapse;font-size:15px;margin-top:12px}
  .plan th,.plan td{padding:9px 8px;text-align:right;vertical-align:top;border-bottom:1px solid var(--line)}
  .plan th{background:var(--c);color:#fff;font-weight:600}
  .plan th:first-child{border-radius:0 12px 12px 0}.plan th:last-child{border-radius:12px 0 0 12px}
  .plan tr.today td{background:var(--w);font-weight:600}
  .plan tr.past td{color:#9AA5BC}
  .plan tr.ex td:first-child{box-shadow:inset -4px 0 0 var(--coral)}
  .plan .d{white-space:nowrap}

  /* focus mode */
  dialog.focus{width:100vw;height:100dvh;margin:0;inset:0}
  dialog.focus::backdrop{background:var(--fb,var(--tamim-w))}
  .f-wrap{height:100%;display:flex;flex-direction:column;align-items:center;padding:18px 16px 26px;background:var(--fb,var(--tamim-w));transition:background .4s}
  .f-top{width:min(560px,100%);display:flex;align-items:center;gap:12px}
  .f-top .x-close{float:none;position:static;background:var(--paper)}
  .f-prog{flex:1}
  .f-prog small{font-weight:600;color:var(--soft)}
  .f-prog .bar{background:var(--paper);height:12px}
  .f-prog .bar i{background:var(--fc,var(--tamim))}
  .f-stage{flex:1;width:min(560px,100%);display:grid;place-items:center;position:relative}
  .f-card{width:100%;background:var(--paper);border-radius:30px;padding:26px 22px 22px;box-shadow:0 8px 0 color-mix(in srgb,var(--fc) 30%,transparent)}
  .f-card.in{animation:fin .45s var(--ease)}
  .f-card.out{animation:fout .4s ease forwards}
  @keyframes fin{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
  @keyframes fout{to{opacity:0;transform:translateX(-120%) rotate(-10deg)}}
  .f-kid{display:inline-block;font-family:var(--display);font-weight:800;font-size:22px;color:#fff;background:var(--fc);border-radius:12px;padding:5px 14px 2px}
  .f-type{margin:12px 0 0;color:var(--soft);font-weight:600}
  .f-card h2{margin:4px 0 0;font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,40px);line-height:1.15}
  .f-card p{margin:10px 0 0;font-size:17.5px}
  .f-extra{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .f-acts{width:min(560px,100%);display:grid;grid-template-columns:1fr 2fr;gap:10px}
  .f-acts .btn{min-height:64px;font-size:22px}
  .f-end{text-align:center}
  .f-end .big-star{width:110px;height:110px;fill:var(--sun);stroke:var(--sun-d);stroke-width:1;animation:spin 1.2s var(--ease)}
  @keyframes spin{from{transform:scale(0) rotate(-120deg)}to{transform:none}}

  .confetti{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:100}
  .confetti i{position:absolute;width:9px;height:14px;border-radius:2px}

  .toast{position:fixed;inset-inline:0;bottom:22px;margin:auto;width:max-content;max-width:92vw;background:var(--ink);color:#fff;z-index:90;
         padding:12px 18px;border-radius:14px;opacity:0;transform:translateY(12px);transition:opacity .25s,transform .25s;pointer-events:none}
  .toast.show{opacity:1;transform:none}
  footer{padding:6px 0 40px;font-size:14px;color:var(--soft)}
  #printArea{display:none}

  /* first paint: lanes rise in one after another */
  .lanes.enter .lane{animation:laneIn .6s var(--ease) both}
  .lanes.enter .lane:nth-child(2){animation-delay:.09s}
  .lanes.enter .lane:nth-child(3){animation-delay:.18s}
  @keyframes laneIn{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}

  @media (min-width:1024px){ .tabs-bar{display:none} }
  @media (max-width:1023px){
    .lanes{grid-template-columns:1fr}
    .lane{display:none}
    .lane.on{display:block}
    .lane.slide{animation:slideIn .38s var(--ease)}
    @keyframes slideIn{from{opacity:0;transform:translateX(var(--from,40px))}to{opacity:1;transform:none}}
  }
  @media (max-width:560px){
    .wrap{padding:0 12px}
    .top{padding-top:16px}
    .top-actions{width:100%}
    .top-actions .btn{flex:1;white-space:nowrap;font-size:20px;padding:10px 12px}
    .top-actions .long{display:none}.top-actions .short{display:inline}
    .lane{border-radius:26px;padding:16px 12px 18px}
    .card{padding:12px 10px 12px 10px;gap:10px}
    .ico{width:40px;height:40px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
  }
  @media print{
    body{background:#fff}
    body.printing > *:not(#printArea){display:none !important}
    body.printing #printArea{display:block}
    dialog,.toast,.tabs-bar,.top-actions,.lane-actions,.more,.tick{display:none !important}
    #printArea h2{font-family:var(--display);margin:0 0 4px}
    .plan th{background:#eee !important;color:#000 !important}
  }
</style>
</head>
<body>
<header class="wrap top">
  <div>
    <p class="hello" id="hello"></p>
    <h1>وش عندنا اليوم؟</h1>
    <p class="summary" id="summary"></p>
  </div>
  <div class="top-actions">
    <button class="btn sun big" id="focusBtn"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></svg>شي واحد بس</button>
    <button class="btn ghost big" id="calBtn"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M12 13v5M9.5 15.5h5"/></svg><span class="long">اربطيه بالتقويم</span><span class="short">التقويم</span></button>
  </div>
</header>

<div class="tabs-bar"><div class="wrap"><div class="tabs" role="tablist" id="tabs"></div></div></div>
<main class="wrap"><div class="lanes enter" id="lanes"></div></main>
<div class="wrap"><footer id="foot"></footer></div>

<dialog id="calDlg" aria-labelledby="calTitle">
  <div class="sheet">
    <button class="x-close" data-close aria-label="سكري"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h2 id="calTitle">كل شي في تقويم جوالج</h2>
    <p>الامتحانات والرحلات ووقت المذاكرة تطلع في التقويم، ويجيج تنبيه قبلها. ولما يتحدث الموقع، يتحدث التقويم بروحه.</p>
    <div class="who" id="calWho"></div>
    <div class="cal-go">
      <a class="btn big" id="calIos" style="--c:var(--ink)"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>آيفون</a>
      <a class="btn ghost big" id="calGoogle" target="_blank" rel="noopener" style="--c:var(--ink)"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>أندرويد أو تقويم قوقل</a>
    </div>
    <p class="note" id="calNote"></p>
  </div>
</dialog>

<dialog id="planDlg" aria-labelledby="planTitle">
  <div class="sheet" id="planSheet"></div>
</dialog>

<dialog id="focus" class="focus" aria-label="شي واحد بس">
  <div class="f-wrap" id="fWrap">
    <div class="f-top">
      <button class="x-close" data-close aria-label="سكري"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="f-prog"><small id="fCount"></small><div class="bar"><i id="fBar"></i></div></div>
    </div>
    <div class="f-stage" id="fStage"></div>
    <div class="f-acts" id="fActs">
      <button class="btn ghost" id="fSkip" style="--c:var(--ink)">بعدين</button>
      <button class="btn" id="fDone">خلصنا</button>
    </div>
  </div>
</dialog>

<div id="printArea"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script>
(function(){
  'use strict';
  const D = window.HOMEWORK;
  const KIDS = D.kids;
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- dates ---------- */
  const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const dt = iso => { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); };
  const isoOf = x => x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0');
  const today = new Date(); today.setHours(0,0,0,0);
  const TODAY = isoOf(today);
  const until = iso => Math.round((dt(iso) - today) / 86400000);
  const fmt = (iso, day) => { const x = dt(iso); return (day ? DAYS[x.getDay()] + ' ' : '') + x.getDate() + ' ' + MONTHS[x.getMonth()]; };
  const rel = iso => { const n = until(iso); return n === 0 ? 'اليوم' : n === 1 ? 'بكرة ' + DAYS[dt(iso).getDay()] : n === 2 ? 'بعد بكرة، ' + fmt(iso, true) : fmt(iso, true); };
  const tierOf = n => n <= 1 ? 'now' : n <= 7 ? 'week' : 'later';
  const isLtr = s => /^[A-Za-z0-9]/.test(s);

  /* ---------- saved ticks (this device only) ---------- */
  const KEY = 'yehal-done-v1';
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { saved = {}; }
  const isDone = (kid, id) => !!(saved[kid] && saved[kid][id]);
  const setDone = (kid, id, v) => {
    saved[kid] = saved[kid] || {};
    if (v) saved[kid][id] = Date.now(); else delete saved[kid][id];
    try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {}
  };
  const starsOf = kid => Object.keys(saved[kid] || {}).length;
  const streakOf = kid => {
    let d = new Date(today), n = 0;
    if (!isDone(kid, 'st:' + isoOf(d))) d.setDate(d.getDate() - 1);
    while (isDone(kid, 'st:' + isoOf(d))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  };

  /* ---------- icons ---------- */
  const svg = (p, cls) => '<svg class="i' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true">' + p + '</svg>';
  const IC = {
    event: svg('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>'),
    study: svg('<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>'),
    hw: svg('<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/>'),
    online: svg('<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M2 20h20"/>'),
    quran: svg('<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>'),
    cal: svg('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M12 13v5M9.5 15.5h5"/>'),
    print: svg('<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/>'),
    open: svg('<path d="M14 3h7v7"/><path d="M10 14L21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/>'),
    table: svg('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/>'),
  };
  const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg>';
  const DOTS = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';

  /* ---------- what each kid has, ranked ---------- */
  const detailFor = (e, kid) => typeof e.detail === 'object' && e.detail ? (e.detail[kid] || '') : (e.detail || '');
  const hwId = h => 'hw:' + (D.week ? D.week.from : '') + ':' + h.file;

  function itemsFor(k){
    const out = [];
    (D.events || []).filter(e => e.kids.includes(k.id)).forEach(e => {
      const n = until(e.date); if (n < 0) return;
      out.push({kind:'event', id:'ev:' + e.date + ':' + e.title, check:true, title:e.title, when:rel(e.date), detail:detailFor(e, k.id),
                cal:e.cal, tier:tierOf(n), score:100 - n});
    });
    const plan = k.plan || [];
    const tp = plan.find(p => p.date === TODAY);
    if (tp) out.push({kind:'study', id:'st:' + tp.date, check:true, title:'مذاكرة اليوم', subject:tp.subject, detail:tp.what,
                      when:'ربع ساعة قرآن، وبعدها 45 دقيقة', tier:'now', score:90});
    else {
      const nx = plan.find(p => until(p.date) > 0);
      if (nx) { const n = until(nx.date);
        out.push({kind:'study', id:'st:' + nx.date, check:false, title:'مذاكرة ' + (n === 1 ? 'بكرة' : fmt(nx.date, true)), subject:nx.subject,
                  detail:nx.what, when:'أول جلسة في الجدول', tier:tierOf(n), score:89 - n}); }
    }
    if ((k.homework || []).length) out.push({kind:'hwgroup', id:'hwg', tier:'week', score:60});
    if (k.onlineCount) out.push({kind:'online', id:'online', tier:'week', score:40});
    if (k.quran) {
      const oral = (k.exams || []).find(e => /^شفهي/.test(e.subject));
      const s = oral ? until(oral.date) : 99, end = oral ? until(oral.dateEnd || oral.date) : -1;
      out.push({kind:'quran', id:'quran', tier: end >= 0 && s <= 7 ? 'week' : 'later', score:55});
    }
    (k.exams || []).forEach((e, i) => {
      const n = until(e.date), end = until(e.dateEnd || e.date);
      if (end < 0 || /^شفهي/.test(e.subject)) return;   // the oral exam lives in the Quran card
      const going = e.dateEnd && n <= 0;
      out.push({kind:'exam', id:'ex:' + i, exam:e, days: Math.max(n, 0), going, tier: going ? 'week' : tierOf(n), score: going ? 70 : 80 - n * 3});
    });
    return out;
  }

  /* ---------- cards ---------- */
  const expanded = new Set();
  const tick = (kid, id, label, pressed) => '<button class="tick" data-tick="' + esc(id) + '" data-kid="' + kid + '" aria-pressed="' + !!pressed + '" aria-label="' + esc(label) + '">' + CHECK + '</button>';
  const xId = (kid, id) => kid + '|' + id;

  function cardHtml(it, k){
    const open = expanded.has(xId(k.id, it.id));
    switch (it.kind) {
      case 'event': return '<article class="card event" data-id="' + esc(it.id) + '"><div class="ico">' + IC.event + '</div><div>' +
        '<h4>' + esc(it.title) + '</h4><span class="when">' + esc(it.when) + '</span>' + (it.detail ? '<p>' + esc(it.detail) + '</p>' : '') +
        (it.cal ? '<div class="row"><a class="chip" href="' + esc(it.cal) + '">' + IC.cal + 'للتقويم</a></div>' : '') +
        '</div>' + tick(k.id, it.id, 'سويناها: ' + it.title) + '</article>';
      case 'study': return '<article class="card" data-id="' + esc(it.id) + '"><div class="ico">' + IC.study + '</div><div>' +
        '<h4>' + esc(it.title) + ': <bdi>' + esc(it.subject) + '</bdi></h4><span class="when">' + esc(it.when) + '</span>' +
        '<p' + (isLtr(it.detail) ? ' dir="ltr" style="text-align:right"' : '') + '>' + esc(it.detail) + '</p>' +
        '<div class="row"><button class="chip" data-plan="' + k.id + '">' + IC.table + 'الجدول كامل</button></div></div>' +
        (it.check ? tick(k.id, it.id, 'خلصنا مذاكرة اليوم') : '<span></span>') + '</article>';
      case 'hwgroup': {
        const hw = k.homework, done = hw.filter(h => isDone(k.id, hwId(h))).length, all = done === hw.length;
        return '<article class="card" data-id="hwg"><div class="ico">' + IC.hw + '</div><div>' +
          '<button class="xbtn' + (open ? ' open-x' : '') + '" data-x="hwg" aria-expanded="' + open + '"><span class="h4">واجبات الطباعة<span class="caret"></span></span>' +
          '<span class="when">' + (all ? 'كلها خلصت، كفو' : 'خلص ' + done + ' من ' + hw.length) + '</span></button>' +
          '<div class="bar" aria-hidden="true"><i style="--v:' + Math.round(done / hw.length * 100) + '%"></i></div>' +
          '<div class="x' + (open ? ' open' : '') + '"><div><ul class="hw">' + hw.map(h => { const id = hwId(h), d = isDone(k.id, id);
            return '<li class="' + (d ? 'done' : '') + '">' + tick(k.id, id, 'خلصنا واجب ' + h.subject, d) + '<span class="t">' + esc(h.subject) + '</span><a href="' + esc(h.file) + '" target="_blank" rel="noopener">افتح</a></li>'; }).join('') +
          '</ul></div></div></div><span></span></article>';
      }
      case 'online': return '<article class="card" data-id="online"><div class="ico">' + IC.online + '</div><div>' +
        '<h4>' + k.onlineCount + ' واجب أونلاين</h4><p>هذي تحلونها سوا على موقع المدرسة، ما تنطبع.</p></div><span></span></article>';
      case 'quran': {
        const q = k.quran;
        return '<article class="card quran" data-id="quran"><div class="ico">' + IC.quran + '</div><div>' +
          '<button class="xbtn' + (open ? ' open-x' : '') + '" data-x="quran" aria-expanded="' + open + '"><span class="h4">القرآن والحديث<span class="caret"></span></span><span class="when">' + esc(q.oral) + '</span></button>' +
          '<div class="x' + (open ? ' open' : '') + '"><div><ul>' + q.items.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>' +
          (k.quranDaily ? '<p>كل يوم ربع ساعة: ' + esc(k.quranDaily) + '</p>' : '') + '</div></div></div><span></span></article>';
      }
      case 'exam': {
        const e = it.exam, n = it.days;
        const badge = it.going ? '<b>الحين</b><small>الفترة</small>' : n === 0 ? '<b>اليوم</b>' : n === 1 ? '<b>بكرة</b>' : '<b data-count="' + n + '">' + n + '</b><small>' + (n <= 10 ? 'أيام' : 'يوم') + '</small>';
        const when = e.dateEnd ? 'من ' + fmt(e.date, true) + ' لين ' + fmt(e.dateEnd, true) : fmt(e.date, true);
        const en = e.topics.every(isLtr);
        return '<article class="card exam" data-id="' + esc(it.id) + '"><div class="days' + (n <= 2 || it.going ? ' hot' : '') + '">' + badge + '</div><div>' +
          '<button class="xbtn' + (open ? ' open-x' : '') + '" data-x="' + esc(it.id) + '" aria-expanded="' + open + '"><span class="h4"><bdi>' + esc(e.subject) + '</bdi><span class="caret"></span></span>' +
          '<span class="when">' + esc(when) + '</span></button>' +
          '<div class="x' + (open ? ' open' : '') + '"><div><p>' + esc(e.time || '') + '</p><ul' + (en ? ' dir="ltr" class="en"' : '') + '>' + e.topics.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>' +
          '<div class="row">' + (e.topicFile ? '<a class="chip" href="' + esc(e.topicFile) + '" target="_blank" rel="noopener">' + IC.open + 'ورقة المدرسة</a>' : '') +
          (e.cal ? '<a class="chip" href="' + esc(e.cal) + '">' + IC.cal + 'للتقويم</a>' : '') + '</div></div></div></div></article>';
      }
    }
    return '';
  }

  const TIERS = [
    {id:'now', name:'الحين', hint:'اليوم وبكرة'},
    {id:'week', name:'هالأسبوع', hint:'الأيام الجاية'},
    {id:'later', name:'بعدين', hint:'الامتحانات الجاية'},
  ];

  function laneHtml(k){
    const items = itemsFor(k);
    const live = items.filter(it => !(it.check && isDone(k.id, it.id)));
    const doneItems = items.filter(it => it.check && isDone(k.id, it.id));
    const stars = starsOf(k.id), streak = streakOf(k.id);
    let h = '<div class="lane-head"><div><h2>' + esc(k.name) + '</h2><p>' + esc(k.gradeAr) + '، <bdi>' + esc(k.grade) + '</bdi></p>' +
      (streak >= 2 ? '<p class="streak">ذاكر' + (k.girl ? 'ت' : '') + ' ' + streak + ' أيام ورا بعض</p>' : '') + '</div>' +
      '<div class="stars" data-stars="' + k.id + '" aria-label="' + stars + ' نجمة">' + STAR + '<b>' + stars + '</b><span>نجمة</span></div></div>';

    const more = [];
    if (k.topicsPrint) more.push('<button class="btn ghost small" data-print="' + esc(k.topicsPrint) + '">' + IC.print + 'مواضيع الامتحانات</button>');
    if (k.arabicBooklet) more.push('<button class="btn ghost small" data-print="' + esc(k.arabicBooklet) + '">' + IC.print + 'مراجعة العربي</button>');
    if ((k.plan || []).length) more.push('<button class="btn ghost small" data-plan="' + k.id + '">' + IC.table + 'جدول المذاكرة</button>');
    more.push('<button class="btn ghost small" data-cal="' + k.id + '">' + IC.cal + 'تقويم ' + esc(k.name) + '</button>');
    const moreOpen = expanded.has(xId(k.id, 'more'));
    h += '<div class="lane-actions">' + (k.printFile
        ? '<button class="btn big" data-print="' + esc(k.printFile) + '">' + IC.print + 'اطبع واجبات ' + esc(k.name) + '</button>'
        : '<button class="btn big" data-cal="' + k.id + '">' + IC.cal + 'فعاليات ' + esc(k.name) + ' في التقويم</button>') +
      (k.printFile ? '<button class="btn ghost more-btn" data-x="more" aria-expanded="' + moreOpen + '" aria-label="طباعة وأشياء ثانية">' + DOTS + '</button>' : '') + '</div>' +
      (k.printFile ? '<div class="more' + (moreOpen ? ' open' : '') + '"><div><div class="more-in">' + more.join('') + '</div></div></div>' : '');

    const nextExam = (k.exams || []).filter(e => !/^شفهي/.test(e.subject) && until(e.date) >= 0)[0];
    if (nextExam) {
      const n = until(nextExam.date), p = Math.max(6, Math.round((1 - Math.min(n, 30) / 30) * 100));
      h += '<div class="count"><div class="num" style="--p:' + p + '"><b data-count="' + n + '">' + n + '</b></div><div><small>أقرب امتحان، باقي ' + (n === 0 ? 'اليوم' : n === 1 ? 'يوم واحد' : n === 2 ? 'يومين' : n + (n <= 10 ? ' أيام' : ' يوم')) + '</small><strong><bdi>' + esc(nextExam.subject) + '</bdi></strong><small>' + esc(fmt(nextExam.date, true)) + '</small></div></div>';
    }

    TIERS.forEach(t => {
      const list = live.filter(it => it.tier === t.id).sort((a, b) => b.score - a.score);
      if (!list.length && t.id !== 'now') return;
      h += '<section class="tier tier-' + t.id + '"><div class="tier-h"><h3>' + (t.id === 'now' && list.length ? '<span class="dot"></span>' : '') + t.name + '</h3><span>' + t.hint + '</span></div>';
      const shown = t.id === 'later' ? list.slice(0, 3) : list, rest = list.slice(shown.length);
      h += list.length ? '<div class="stack">' + shown.map(it => cardHtml(it, k)).join('') + '</div>' : '<p class="calm">ما في شي ضروري الحين.</p>';
      if (rest.length) { const o = expanded.has(xId(k.id, 'later'));
        h += '<button class="rest-btn' + (o ? ' open-x' : '') + '" data-x="later" aria-expanded="' + o + '">وباقي ' + rest.length + ' امتحانات<span class="caret"></span></button>' +
             '<div class="x' + (o ? ' open' : '') + '"><div><div class="stack">' + rest.map(it => cardHtml(it, k)).join('') + '</div></div></div>'; }
      h += '</section>';
    });

    if (doneItems.length) {
      const o = expanded.has(xId(k.id, 'done'));
      h += '<div class="done-box"><button data-x="done" aria-expanded="' + o + '" class="' + (o ? 'open-x' : '') + '">' + STAR.replace('<svg', '<svg style="width:22px;height:22px;fill:var(--sun);stroke:var(--sun-d)"') +
        'خلصناها (' + doneItems.length + ')<span class="caret"></span></button><div class="x' + (o ? ' open' : '') + '"><div><ul class="done-list">' +
        doneItems.map(it => '<li><span>' + esc(it.kind === 'study' ? it.title + ': ' + it.subject : it.title) + '</span><button class="undo" data-undo="' + esc(it.id) + '" data-kid="' + k.id + '">رجّعيه</button></li>').join('') + '</ul></div></div></div>';
    }
    if (!(k.homework || []).length && !(k.exams || []).length)
      h += '<p class="lane-foot">' + esc(k.name) + ' ما عند' + (k.girl ? 'ها' : 'ه') + ' واجبات ولا امتحانات، بس فعاليات ' + (k.grade.startsWith('KG') ? 'الروضة' : 'المدرسة') + '.</p>';
    return h;
  }

  /* ---------- page ---------- */
  let active = (location.hash || '').slice(1);
  if (!KIDS.some(k => k.id === active)) active = KIDS[0].id;

  function nowCount(k){ return itemsFor(k).filter(it => it.tier === 'now' && !(it.check && isDone(k.id, it.id))).length; }
  function weekCount(k){ return itemsFor(k).filter(it => it.tier === 'week' && !(it.check && isDone(k.id, it.id))).length; }

  function renderTop(){
    const h = new Date().getHours();
    $('#hello').textContent = (h < 12 ? 'صباح الخير' : 'مساء الخير') + '، ' + fmt(TODAY, true);
    const now = KIDS.reduce((s, k) => s + nowCount(k), 0), wk = KIDS.reduce((s, k) => s + weekCount(k), 0);
    $('#summary').innerHTML = now ? 'الحين <b>' + now + '</b> ' + (now === 1 ? 'شي' : now === 2 ? 'شيين' : now <= 10 ? 'أشياء' : 'شي') + '، وهالأسبوع <b>' + wk + '</b>.' : 'ما في شي ضروري الحين. هالأسبوع <b>' + wk + '</b>.';
    const tabs = $('#tabs');
    if (!tabs.children.length) tabs.innerHTML = KIDS.map(k => '<button class="tab" role="tab" data-tab="' + k.id + '" style="--c:var(--' + k.id + ')">' + esc(k.name) + '<span class="n" hidden></span></button>').join('') + '<span class="pill"></span>';
    KIDS.forEach((k, i) => {
      const b = tabs.querySelector('[data-tab="' + k.id + '"]'), n = nowCount(k), badge = b.querySelector('.n');
      b.setAttribute('aria-selected', k.id === active); badge.hidden = !n; badge.textContent = n;
    });
    const pill = tabs.querySelector('.pill');
    pill.style.setProperty('--pi', KIDS.findIndex(k => k.id === active)); pill.style.setProperty('--pc', 'var(--' + active + ')');
  }

  function renderLane(k, el){
    el = el || document.querySelector('.lane[data-kid="' + k.id + '"]');
    el.innerHTML = laneHtml(k);
  }

  function renderAll(){
    $('#lanes').innerHTML = KIDS.map(k => '<section class="lane' + (k.id === active ? ' on' : '') + '" data-kid="' + k.id + '" aria-label="' + esc(k.name) + '"></section>').join('');
    KIDS.forEach(k => renderLane(k));
    renderTop();
  }

  function countUp(root){
    if (reduce) return;
    root.querySelectorAll('[data-count]').forEach(b => {
      const end = +b.dataset.count; if (!end) return;
      const t0 = performance.now(), dur = 700;
      const step = t => { const p = Math.min(1, (t - t0) / dur); b.textContent = Math.round(end * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
      b.textContent = '0'; requestAnimationFrame(step);
    });
  }

  function switchKid(id, dir){
    if (id === active) return;
    const oldIdx = KIDS.findIndex(k => k.id === active), newIdx = KIDS.findIndex(k => k.id === id);
    active = id;
    history.replaceState(null, '', '#' + id);
    document.querySelectorAll('.lane').forEach(l => { const on = l.dataset.kid === id; l.classList.toggle('on', on); l.classList.remove('slide');
      if (on) { l.style.setProperty('--from', ((dir || (newIdx > oldIdx ? 1 : -1)) * -40) + 'px'); void l.offsetWidth; l.classList.add('slide'); countUp(l); } });
    renderTop();
    const y = $('#lanes').getBoundingClientRect().top + window.scrollY - 80;
    if (window.scrollY > y) window.scrollTo({top: y, behavior: reduce ? 'auto' : 'smooth'});
  }

  /* ---------- celebrations ---------- */
  function confetti(x, y, colors, count){
    if (reduce) return;
    const box = document.createElement('div'); box.className = 'confetti'; box.style.left = x + 'px'; box.style.top = y + 'px';
    for (let i = 0; i < (count || 22); i++) {
      const p = document.createElement('i');
      p.style.background = colors[i % colors.length];
      if (i % 3 === 0) { p.style.borderRadius = '50%'; p.style.width = p.style.height = '9px'; }
      box.appendChild(p);
      const a = Math.random() * Math.PI * 2, r = 50 + Math.random() * 90;
      const dx = Math.cos(a) * r, dy = Math.sin(a) * r - 40;
      p.animate([{transform:'translate(0,0) rotate(0)', opacity:1},
                 {transform:'translate(' + dx + 'px,' + dy + 'px) rotate(' + (Math.random() * 360) + 'deg)', opacity:1, offset:.55},
                 {transform:'translate(' + dx * 1.15 + 'px,' + (dy + 90) + 'px) rotate(' + (Math.random() * 720) + 'deg)', opacity:0}],
                {duration: 900 + Math.random() * 400, easing:'cubic-bezier(.2,.7,.4,1)', fill:'forwards'});
    }
    (document.querySelector('dialog[open]') || document.body).appendChild(box); setTimeout(() => box.remove(), 1500);
  }
  const kidColors = id => { const cs = getComputedStyle(document.documentElement); return [cs.getPropertyValue('--' + id).trim(), cs.getPropertyValue('--sun').trim(), cs.getPropertyValue('--coral').trim(), cs.getPropertyValue('--quran').trim()]; };

  const PRAISE = ['كفو', 'عاش', 'بطل', 'ممتاز', 'ما شاء الله عليكم', 'شغل نظيف'];
  const praise = () => PRAISE[Math.floor(Math.random() * PRAISE.length)];

  function markDone(kid, id, btn){
    const k = KIDS.find(x => x.id === kid);
    setDone(kid, id, true);
    if (btn) {
      btn.setAttribute('aria-pressed', 'true');
      const r = btn.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top + r.height / 2, kidColors(kid));
    }
    const card = btn && btn.closest('.card');
    const inList = btn && btn.closest('.hw');
    setTimeout(() => {
      if (card && !inList) card.classList.add('going');
      setTimeout(() => {
        renderLane(k); renderTop();
        const st = document.querySelector('[data-stars="' + kid + '"]'); if (st) st.classList.add('bump');
        const hw = k.homework || [];
        if (inList && hw.length && hw.every(h => isDone(kid, hwId(h)))) { say('خلصت كل واجبات ' + k.name + '، ' + praise()); bigCelebrate(kid); }
        else say(praise() + '، نجمة زيادة ل' + k.name);
      }, card && !inList ? 300 : 120);
    }, 380);
  }
  function bigCelebrate(kid){ const w = innerWidth; [0.25, 0.5, 0.75].forEach((f, i) => setTimeout(() => confetti(w * f, innerHeight * 0.35, kidColors(kid), 30), i * 160)); }

  const toast = $('#toast');
  const say = m => { toast.textContent = m; toast.classList.add('show'); clearTimeout(say.t); say.t = setTimeout(() => toast.classList.remove('show'), 2600); };

  /* ---------- printing ---------- */
  const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  function printPdf(url){
    if (mobile || location.protocol === 'file:') { window.open(url, '_blank', 'noopener'); say('انفتح الملف، اطبعيه من زر الطباعة فيه'); return; }
    say('يتجهز للطباعة...');
    const f = document.createElement('iframe');
    f.style.cssText = 'position:fixed;width:1px;height:1px;border:0;left:-10px;bottom:-10px';
    f.src = url;
    f.onload = () => { setTimeout(() => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (err) { window.open(url, '_blank', 'noopener'); } }, 400); setTimeout(() => f.remove(), 120000); };
    document.body.appendChild(f);
  }

  /* ---------- study plan sheet ---------- */
  function planTable(k){
    const examDays = new Set((k.exams || []).filter(e => !e.dateEnd).map(e => e.date));
    return '<table class="plan"><thead><tr><th>اليوم</th><th>المادة</th><th>وش نذاكر</th></tr></thead><tbody>' + k.plan.map(p => {
      const n = until(p.date);
      const cls = [n < 0 ? 'past' : '', p.date === TODAY ? 'today' : '', examDays.has(p.date) ? 'ex' : ''].join(' ');
      return '<tr class="' + cls + '"><td class="d">' + fmt(p.date, true) + (examDays.has(p.date) ? '<br><small>فيه امتحان</small>' : '') + '</td><td><bdi>' + esc(p.subject) + '</bdi></td><td' + (isLtr(p.what) ? ' dir="ltr" style="text-align:right"' : '') + '>' + esc(p.what) + '</td></tr>';
    }).join('') + '</tbody></table>';
  }
  function openPlan(id){
    const k = KIDS.find(x => x.id === id), dlg = $('#planDlg');
    dlg.style.setProperty('--c', 'var(--' + k.id + ')'); dlg.style.setProperty('--w', 'var(--' + k.id + '-w)');
    $('#planSheet').innerHTML = '<button class="x-close" data-close aria-label="سكري">' + svg('<path d="M6 6l12 12M18 6L6 18"/>') + '</button>' +
      '<h2 id="planTitle">جدول مذاكرة ' + esc(k.name) + '</h2><p>كل يوم ساعة: ربع ساعة قرآن وحديث (' + esc(k.quranDaily || '') + ')، وبعدها 45 دقيقة للمادة. ومن الأحد للخميس نص ساعة للواجبات.</p>' +
      '<button class="btn small" data-printplan="' + k.id + '" style="margin-top:6px">' + IC.print + 'اطبع الجدول</button>' + planTable(k);
    dlg.showModal();
    const tr = dlg.querySelector('tr.today'); if (tr) tr.scrollIntoView({block:'center'});
  }
  function printPlan(id){
    const k = KIDS.find(x => x.id === id);
    const pa = $('#printArea'); pa.style.setProperty('--c', 'var(--' + k.id + ')');
    pa.innerHTML = '<h2>جدول مذاكرة ' + esc(k.name) + '</h2><p>كل يوم ساعة: ربع ساعة قرآن وحديث، و45 دقيقة للمادة. ومن الأحد للخميس نص ساعة للواجبات.</p>' + planTable(k);
    $('#planDlg').close(); document.body.classList.add('printing'); setTimeout(() => window.print(), 50);
  }

  /* ---------- calendar sheet ---------- */
  const base = location.href.replace(/[#?].*$/, '').replace(/[^/]*$/, '');
  let calWho = 'all';
  function calRender(){
    const opts = [{id:'all', name:'الكل', c:'var(--ink)'}].concat(KIDS.map(k => ({id:k.id, name:k.name, c:'var(--' + k.id + ')'})));
    $('#calWho').innerHTML = opts.map(o => '<button data-who="' + o.id + '" aria-pressed="' + (o.id === calWho) + '" style="--c:' + o.c + '">' + esc(o.name) + '</button>').join('');
    const https = base + 'cal/' + calWho + '.ics';
    const webcal = https.replace(/^https?:/, 'webcal:');
    $('#calIos').href = webcal;
    $('#calGoogle').href = 'https://calendar.google.com/calendar/r?cid=' + encodeURIComponent(webcal);
    $('#calNote').textContent = 'المذاكرة محطوطة كل يوم الساعة ' + (D.studyTime || '4:30') + ' العصر. في الآيفون، إذا طلع لج خيار (Remove Alerts) خليه طافي عشان توصلج التنبيهات.';
  }
  function openCal(who){ calWho = who || 'all'; calRender(); $('#calDlg').showModal(); }

  /* ---------- one thing at a time ---------- */
  let fList = [], fIdx = 0, fDoneCount = 0;
  function focusItems(){
    const out = [];
    KIDS.forEach((k, ki) => {
      itemsFor(k).forEach(it => {
        if (it.kind === 'event' && it.tier !== 'later' && !isDone(k.id, it.id)) out.push({k, id:it.id, type:'من المدرسة، ' + it.when, title:it.title, text:it.detail, cal:it.cal, score:it.score, ki});
        if (it.kind === 'study' && it.check && !isDone(k.id, it.id)) out.push({k, id:it.id, type:'مذاكرة اليوم، ساعة', title:it.subject, text:it.detail, plan:true, score:it.score, ki});
      });
      (k.homework || []).forEach((h, i) => { const id = hwId(h); if (!isDone(k.id, id)) out.push({k, id, type:'واجب للطباعة', title:'واجب ' + h.subject, text:'اطبعيه وحلوه سوا.', file:h.file, score:60 - i * .1, ki}); });
    });
    return out.sort((a, b) => b.score - a.score || a.ki - b.ki);
  }
  function fShow(dir){
    const stage = $('#fStage'), wrap = $('#fWrap'), total = fList.length;
    $('#fCount').textContent = fIdx < total ? (fIdx + 1) + ' من ' + total : 'خلصنا';
    $('#fBar').style.setProperty('--v', Math.round(fIdx / Math.max(total, 1) * 100) + '%');
    if (fIdx >= total) {
      wrap.style.setProperty('--fb', 'var(--sun-w)'); wrap.style.setProperty('--fc', 'var(--sun-d)'); $('#focus').style.setProperty('--fb', 'var(--sun-w)');
      stage.innerHTML = '<div class="f-card f-end in"><svg class="big-star" viewBox="0 0 24 24">' + STAR.replace(/<\/?svg[^>]*>/g, '') + '</svg><h2>' + (fDoneCount ? 'خلصتوا ' + fDoneCount + '، ' + praise() : 'ما باقي شي الحين') + '</h2><p>' + (fDoneCount ? 'كل شي خلص صار له نجمة.' : 'ارجعي بعدين.') + '</p></div>';
      $('#fActs').innerHTML = '<span></span><button class="btn" data-close style="--c:var(--ink)">رجوع</button>';
      if (fDoneCount) bigCelebrate('tamim');
      return;
    }
    const it = fList[fIdx], k = it.k;
    ['--fb', '--fc'].forEach((v, i) => { const val = 'var(--' + k.id + (i ? '' : '-w') + ')'; wrap.style.setProperty(v, val); $('#focus').style.setProperty(v, val); });
    const extra = [];
    if (it.file) extra.push('<a class="btn ghost small" style="--c:var(--' + k.id + ')" href="' + esc(it.file) + '" target="_blank" rel="noopener">' + IC.open + 'افتح الواجب</a>');
    if (it.cal) extra.push('<a class="btn ghost small" style="--c:var(--' + k.id + ')" href="' + esc(it.cal) + '">' + IC.cal + 'للتقويم</a>');
    if (it.plan) extra.push('<button class="btn ghost small" style="--c:var(--' + k.id + ')" data-plan="' + k.id + '">' + IC.table + 'الجدول كامل</button>');
    stage.innerHTML = '<div class="f-card in"><span class="f-kid">' + esc(k.name) + '</span><p class="f-type">' + esc(it.type) + '</p><h2><bdi>' + esc(it.title) + '</bdi></h2>' +
      (it.text ? '<p' + (isLtr(it.text) ? ' dir="ltr" style="text-align:right"' : '') + '>' + esc(it.text) + '</p>' : '') + (extra.length ? '<div class="f-extra">' + extra.join('') + '</div>' : '') + '</div>';
    $('#fActs').innerHTML = '<button class="btn ghost" id="fSkip" style="--c:var(--ink)">بعدين</button><button class="btn" id="fDone" style="--c:var(--' + k.id + ');--d:var(--' + k.id + '-d)">' + CHECK.replace('<svg', '<svg class="i" style="stroke-width:3"') + 'خلصنا</button>';
  }
  function fNext(done){
    const card = $('#fStage .f-card');
    if (done) { const it = fList[fIdx]; setDone(it.k.id, it.id, true); fDoneCount++;
      const b = $('#fDone').getBoundingClientRect(); confetti(b.left + b.width / 2, b.top, kidColors(it.k.id), 28); }
    if (card && !reduce) { card.classList.remove('in'); card.classList.add('out'); }
    setTimeout(() => { fIdx++; fShow(); }, reduce ? 0 : 330);
  }
  function openFocus(){
    fList = focusItems(); fIdx = 0; fDoneCount = 0;
    $('#focus').showModal(); fShow();
  }

  /* ---------- events ---------- */
  document.addEventListener('click', e => {
    const t = e.target;
    const tb = t.closest('[data-tab]'); if (tb) { switchKid(tb.dataset.tab); return; }
    const tk = t.closest('[data-tick]');
    if (tk) { const kid = tk.dataset.kid, id = tk.dataset.tick;
      if (tk.getAttribute('aria-pressed') === 'true') { setDone(kid, id, false); renderLane(KIDS.find(x => x.id === kid)); renderTop(); }
      else markDone(kid, id, tk);
      return; }
    const un = t.closest('[data-undo]'); if (un) { setDone(un.dataset.kid, un.dataset.undo, false); renderLane(KIDS.find(x => x.id === un.dataset.kid)); renderTop(); say('رجّعناه للقائمة'); return; }
    const xb = t.closest('[data-x]');
    if (xb) { const lane = xb.closest('.lane'), kid = lane.dataset.kid, key = xId(kid, xb.dataset.x);
      const open = !expanded.has(key); open ? expanded.add(key) : expanded.delete(key);
      xb.setAttribute('aria-expanded', open); xb.classList.toggle('open-x', open);
      const panel = xb.dataset.x === 'more' ? lane.querySelector('.more') : xb.nextElementSibling && xb.nextElementSibling.classList.contains('x') ? xb.nextElementSibling : xb.parentElement.querySelector('.x');
      if (panel) panel.classList.toggle('open', open);
      return; }
    const pr = t.closest('[data-print]'); if (pr) { e.preventDefault(); printPdf(pr.dataset.print); return; }
    const pp = t.closest('[data-printplan]'); if (pp) { printPlan(pp.dataset.printplan); return; }
    const pl = t.closest('[data-plan]'); if (pl) { if ($('#focus').open) $('#focus').close(); openPlan(pl.dataset.plan); return; }
    const cl = t.closest('[data-cal]'); if (cl) { openCal(cl.dataset.cal); return; }
    const wh = t.closest('[data-who]'); if (wh) { calWho = wh.dataset.who; calRender(); return; }
    if (t.closest('#fDone')) { fNext(true); return; }
    if (t.closest('#fSkip')) { fNext(false); return; }
    const cx = t.closest('[data-close]'); if (cx) { const d = cx.closest('dialog'); d.close(); return; }
    if (t.tagName === 'DIALOG' && !t.classList.contains('focus')) t.close();   // tap outside the sheet
  });
  window.addEventListener('afterprint', () => document.body.classList.remove('printing'));
  $('#focusBtn').addEventListener('click', openFocus);
  $('#calBtn').addEventListener('click', () => openCal('all'));
  $('#focus').addEventListener('close', () => { KIDS.forEach(k => renderLane(k)); renderTop(); });

  // swipe between kids on the phone
  let sx = null, sy = 0;
  $('#lanes').addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  $('#lanes').addEventListener('touchend', e => {
    if (sx === null || innerWidth >= 1024) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) < 70 || Math.abs(dy) > 50) return;
    const i = KIDS.findIndex(k => k.id === active), j = i + (dx > 0 ? 1 : -1);   // right-to-left: the next kid sits on the left
    if (j >= 0 && j < KIDS.length) switchKid(KIDS[j].id, dx > 0 ? 1 : -1);
  }, {passive:true});

  $('#foot').textContent = 'آخر تحديث ' + fmt(D.updated, true) + '. الملفات من بوابة المدرسة وقروبات الصف. الصح اللي تحطونه يبقى على هالجهاز بس.';

  renderAll();
  countUp(document);
  setTimeout(() => $('#lanes').classList.remove('enter'), 1200);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
</html>
